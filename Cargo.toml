[package]
name = "licenselint"
version = "0.1.0"
edition = "2021"
description = "One dependency-license scan across Cargo, npm and pip in a polyglot repo, with an allowlist/denylist"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/licenselint"
readme = "README.md"
keywords = ["license", "spdx", "compliance", "dependencies", "audit"]
categories = ["command-line-utilities"]

[lib]
name = "licenselint"
path = "src/lib.rs"

[[bin]]
name = "licenselint"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
